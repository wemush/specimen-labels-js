name: Interop

# Cross-library round trip: this library and the Python `wols` library each
# encrypt interop/matrix.json, and each decrypts the other's labels.
# Runs against the published Python package and against its main branch, so a
# regression on either side fails the build. The nightly run catches changes
# that land on the Python side between pull requests here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Round trip with Python wols ${{ matrix.python-wols.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-wols:
          - name: '1.3.0 (PyPI)'
            slug: pypi-1.3.0
            requirement: 'wols[crypto]==1.3.0'
          - name: main
            slug: main
            requirement: 'wols[crypto] @ git+https://github.com/wemush/specimen-labels-py@main'
    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: latest

      - name: Build this library
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0

      - name: Install Python wols ${{ matrix.python-wols.name }}
        env:
          REQUIREMENT: ${{ matrix.python-wols.requirement }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/py"
          uv pip install --python "$RUNNER_TEMP/py/bin/python" "$REQUIREMENT"
          uv pip show --python "$RUNNER_TEMP/py/bin/python" wols

      - name: Round trip (TS -> Python, Python -> TS)
        run: interop/roundtrip.sh . "$RUNNER_TEMP/py/bin/python" "$RUNNER_TEMP/corpora"

      - name: Upload corpora
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: interop-corpora-python-${{ matrix.python-wols.slug }}
          path: ${{ runner.temp }}/corpora/
          if-no-files-found: ignore
