name: Interop

# Cross-library round trips (tests/interop): labels generated by the Python
# `wols` package must decrypt with this library, and labels generated here
# must decrypt with `wols`. Runs against the published `wols` release and
# against its main branch, so a regression on either side fails the build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WOLS_PY_PUBLISHED_VERSION: '1.4.0'

jobs:
  interop:
    name: Round trip with wols (Python, ${{ matrix.py }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        py: ['published', 'main']

    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979  # v2.1.0
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Package
        run: bun run build

      - name: Run interop tests (checked-in 1.3.0 corpora)
        run: npx vitest run tests/interop

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b  # v7.2.0
        with:
          # No uv.lock or requirements file here to key a cache on.
          enable-cache: false

      - name: Checkout specimen-labels-py (main)
        if: matrix.py == 'main'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          repository: wemush/specimen-labels-py
          ref: main
          path: specimen-labels-py

      - name: Install wols (Python)
        run: |
          PY_ENV="$RUNNER_TEMP/wols-py"
          uv venv --python 3.13 "$PY_ENV"
          if [ "${{ matrix.py }}" = "published" ]; then
            uv pip install --python "$PY_ENV" "wols[crypto]==${WOLS_PY_PUBLISHED_VERSION}"
          else
            uv pip install --python "$PY_ENV" "./specimen-labels-py[crypto]"
          fi
          "$PY_ENV/bin/python" -c "import wols; print('wols', wols.__version__)"
          echo "PY=$PY_ENV/bin/python" >> "$GITHUB_ENV"
          # The harness imports the built package, as a consumer would.
          echo "WOLS_JS_MODULE=$GITHUB_WORKSPACE/dist/esm/index.js" >> "$GITHUB_ENV"

      - name: Compare tests/interop with specimen-labels-py
        if: matrix.py == 'main'
        run: |
          for f in matrix.json harness.py harness.mjs README.md corpus/python-1.3.0.json corpus/typescript-1.3.0.json; do
            other="specimen-labels-py/tests/interop/$f"
            if [ ! -f "$other" ]; then
              echo "::notice::specimen-labels-py main has no tests/interop/$f yet"
            elif ! cmp -s "tests/interop/$f" "$other"; then
              echo "::warning file=tests/interop/$f::tests/interop/$f differs from specimen-labels-py main; keep the copies identical"
            fi
          done

      - name: Python generates, TypeScript decrypts
        run: |
          "$PY" tests/interop/harness.py generate tests/interop/matrix.json "$RUNNER_TEMP/corpus-python.json"
          node tests/interop/harness.mjs verify tests/interop/matrix.json "$RUNNER_TEMP/corpus-python.json"

      - name: TypeScript generates, Python decrypts
        if: success() || failure()
        run: |
          node tests/interop/harness.mjs generate tests/interop/matrix.json "$RUNNER_TEMP/corpus-typescript.json"
          "$PY" tests/interop/harness.py verify tests/interop/matrix.json "$RUNNER_TEMP/corpus-typescript.json"

      - name: Upload corpora
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: interop-corpora-${{ matrix.py }}
          path: ${{ runner.temp }}/corpus-*.json
          if-no-files-found: ignore
